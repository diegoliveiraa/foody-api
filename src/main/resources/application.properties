spring.application.name=foody-api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
logging.pattern.correlation=[%X{requestId:-}] 
foody.security.jwt.public-key=file:.secrets/jwt-public.pem
foody.security.jwt.private-key=file:.secrets/jwt-private.pem
foody.security.refresh-token-cleanup.cron=0 0 4 * * *
foody.web.allowed-origins=http://localhost:5173,http://localhost:4174
foody.rate-limit.max-tracked-keys=100000
foody.rate-limit.login.capacity=20
foody.rate-limit.login.period=1m
foody.rate-limit.login-per-email.capacity=5
foody.rate-limit.login-per-email.period=1m
foody.rate-limit.register.capacity=5
foody.rate-limit.register.period=1h
foody.rate-limit.refresh.capacity=30
foody.rate-limit.refresh.period=1m
foody.rate-limit.place-order.capacity=10
foody.rate-limit.place-order.period=1m
foody.rate-limit.request-cancellation.capacity=5
foody.rate-limit.request-cancellation.period=1m
foody.rate-limit.authenticated.capacity=300
foody.rate-limit.authenticated.period=1m
foody.rate-limit.anonymous.capacity=60
foody.rate-limit.anonymous.period=1m
