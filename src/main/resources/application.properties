spring.application.name=foody-api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
logging.pattern.correlation=[%X{requestId:-}] 
foody.security.jwt.public-key=file:.secrets/jwt-public.pem
foody.security.jwt.private-key=file:.secrets/jwt-private.pem
foody.web.allowed-origins=http://localhost:5173,http://localhost:4174
