name: foody-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: foody
      POSTGRES_USER: foody
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foody -d foody"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
