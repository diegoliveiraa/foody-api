name: foody

services:
  api:
    build: .
    image: ${FOODY_API_IMAGE:-foody-api:latest}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/foody
      SPRING_DATASOURCE_USERNAME: foody
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      FOODY_SECURITY_JWT_PRIVATEKEY: file:/run/secrets/jwt_private_key
      FOODY_SECURITY_JWT_PUBLICKEY: file:/run/secrets/jwt_public_key
      FOODY_WEB_ALLOWEDORIGINS: ${FOODY_WEB_ALLOWEDORIGINS:-http://localhost:5173}
    secrets:
      - jwt_private_key
      - jwt_public_key
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1024M}
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: foody
      POSTGRES_USER: foody
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foody -d foody"]
      interval: 5s
      timeout: 3s
      retries: 10
    shm_size: 128mb
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-512M}
    restart: unless-stopped

secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_FILE:-./.secrets/jwt-private.pem}
  jwt_public_key:
    file: ${JWT_PUBLIC_KEY_FILE:-./.secrets/jwt-public.pem}

volumes:
  postgres-data:
