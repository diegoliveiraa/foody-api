name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests and rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Format, compile, tests and architecture rules
        run: ./mvnw -B verify
      - name: The OpenAPI contract is committed
        run: git diff --exit-code -- docs/openapi.json
      - name: No comments in code
        run: bash scripts/check-comments.sh

  image:
    name: Image runs healthy
    needs: verify
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate a throwaway JWT key pair
        run: bash scripts/generate-jwt-keys.sh
      - name: Build the image and start the deploy stack
        run: docker compose -f compose.deploy.yaml up -d --build --wait --wait-timeout 300
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.deploy.yaml logs
      - name: Tear down
        if: always()
        run: docker compose -f compose.deploy.yaml down --volumes
