name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests and rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Format, compile, tests and architecture rules
        run: ./mvnw -B verify
      - name: The OpenAPI contract is committed
        run: git diff --exit-code -- docs/openapi.json
      - name: No comments in code
        run: bash scripts/check-comments.sh

  image:
    name: Image runs healthy
    needs: verify
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate a throwaway JWT key pair
        run: bash scripts/generate-jwt-keys.sh
      - name: Build the image and start the deploy stack
        run: docker compose -f compose.deploy.yaml up -d --build --wait --wait-timeout 300
      - name: Smoke test registers a customer and reads /me
        shell: bash
        run: |
          base_url="http://127.0.0.1:8080"
          body=$(jq -n --arg email "smoke-${GITHUB_RUN_ID}@foody.dev" --arg password "$(openssl rand -hex 16)" \
            '{name: "Smoke Test", email: $email, password: $password}')
          token=$(curl -fsS -X POST "$base_url/auth/register" -H 'Content-Type: application/json' -d "$body" \
            | jq -er '.accessToken')
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$base_url/me")
          echo "GET /me answered $status"
          test "$status" = "200"
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.deploy.yaml logs
      - name: Tear down
        if: always()
        run: docker compose -f compose.deploy.yaml down --volumes
